# Exemplo nginx → Next.js em 127.0.0.1:3000
# Em produção o Certbot adiciona o bloco SSL automaticamente.

server {
    listen 80;
    listen [::]:80;
    server_name meulotefacil.com.br www.meulotefacil.com.br;

    client_max_body_size 20m;

    # Hero frames: estático direto (não depende do Node / sobrevive a restart do PM2)
    location /hero-frames/ {
        alias /var/www/meulotefacil/public/hero-frames/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
