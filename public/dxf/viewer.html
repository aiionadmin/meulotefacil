<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Lote Fácil · Visualizador DXF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Visual MLF: Montserrat + laranja #ED8600 — canvas DXF intacto */
:root{--bg:#f7f4ef;--panel:#fff;--line:#e2ddd4;--tx:#1b1e24;--mut:#6a7180;--acc:#ED8600}
body.dark-bg{--bg:#16181d;--panel:#1e2128;--line:#2e323c;--tx:#e6e8ec;--mut:#8b92a1;--acc:#ED8600}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 280px;font:13px/1.45 Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--tx);background:var(--bg);overflow:hidden}
body.nopanel{grid-template-columns:1fr 0}body.nopanel aside{display:none}
header{grid-column:1/-1;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{margin:0 10px 0 4px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
button{font:inherit;color:var(--tx);background:transparent;border:1px solid var(--line);border-radius:4px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button.on,button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.sp{flex:1}
#stage{position:relative;min-width:0;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}
aside{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
aside .top{padding:10px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:0;width:100%}
#q{flex:1 1 100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
#layers{overflow:auto;flex:1;padding:4px 0}
.lay{display:flex;align-items:center;gap:8px;padding:4px 10px;cursor:pointer}.lay:hover{background:rgba(127,127,127,.12)}.lay[hidden]{display:none}
.lay i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(127,127,127,.5);flex:none}
.lay span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.lay em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums;font-size:11px}
footer{grid-column:1/-1;display:flex;gap:16px;padding:5px 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);font-variant-numeric:tabular-nums;white-space:pre}
#drop{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px}
#drop[hidden],#busy[hidden]{display:none}
#drop div{border:2px dashed var(--line);border-radius:6px;padding:40px 48px;max-width:460px}
#drop h1{font-size:18px;margin:0 0 6px}#drop p{color:var(--mut);margin:0 0 16px}
body.drag #stage::after{content:"Solte o arquivo DXF aqui";position:absolute;inset:8px;display:grid;place-items:center;font-size:18px;border:2px dashed var(--acc);border-radius:6px;background:rgba(237,134,0,.12);pointer-events:none}
#busy{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;box-shadow:0 4px 18px rgba(0,0,0,.3);max-width:90%}
@media(max-width:700px){body{grid-template-columns:1fr 0}aside{position:fixed;right:0;top:46px;bottom:28px;width:260px;z-index:2}}
</style>
</head>
<body>
<header>
  <b id="fname">Meu Lote Fácil · DXF</b>
  <button id="open" class="pri">Abrir DXF…</button>
  <button id="fit" title="Enquadrar (F ou duplo clique)">Enquadrar</button>
  <button id="zin" title="Aproximar" aria-label="Aproximar">+</button>
  <button id="zout" title="Afastar" aria-label="Afastar">−</button>
  <button id="measure" title="Clique em dois pontos para medir a distância">Medir</button>
  <span class="sp"></span>
  <button id="bg">Fundo claro/escuro</button>
  <button id="toggle">Camadas</button>
  <input id="file" type="file" accept=".dxf,.DXF" hidden>
</header>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="drop"><div><h1>Abra um arquivo DXF</h1><p>Arraste o arquivo para cá ou escolha no computador. Nada é enviado para a internet — o desenho é lido aqui mesmo no navegador.</p><button id="open2" class="pri">Escolher arquivo…</button></div></div>
  <div id="busy" hidden></div>
</div>
<aside>
  <div class="top"><h2>Camadas</h2><input id="q" type="search" placeholder="Filtrar camadas…" aria-label="Filtrar camadas"><button id="all">Mostrar todas</button><button id="none">Ocultar todas</button></div>
  <div id="layers"></div>
</aside>
<footer><span id="coord">E —   N —</span><span class="sp"></span><span id="info">Roda do mouse: zoom · Arrastar: mover</span></footer>

<script>
